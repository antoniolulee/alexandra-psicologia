<!-- Cookie Consent Component (RGPD / AEPD Compliant) -->
<div x-data="{ 
    show: false,
    init() {
        try {
            if (!localStorage.getItem('cookieConsent')) {
                setTimeout(() => {
                    this.show = true;
                }, 800);
            }
        } catch (e) {}
    },
    reject() {
        try {
            localStorage.setItem('cookieConsent', 'rejected');
        } catch (e) {}
        this.show = false;
    },
    accept() {
        try {
            localStorage.setItem('cookieConsent', 'accepted');
            window.dispatchEvent(new CustomEvent('cookie-consent-granted'));
        } catch (e) {}
        this.show = false;
    }
}" x-show="show" x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-300" x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 translate-y-4" class="fixed bottom-4 right-4 z-50 max-w-md w-full mx-4 sm:mx-0"
  style="display: none;"> <!-- Hidden by default to prevent FOUC until Alpine loads -->

  <div
    class="bg-white dark:bg-dark-secondary-alt border border-border dark:border-dark-border rounded-xl shadow-2xl p-6 flex flex-col gap-4">
    <div class="flex justify-between items-start">
      <h3 class="text-base font-heading font-semibold text-primary dark:text-dark-primary">Privacidad y Cookies</h3>
      <button @click="reject()" aria-label="Cerrar y rechazar no esenciales"
        class="text-text-muted hover:text-text dark:text-dark-text-muted dark:hover:text-dark-text transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <p class="text-sm text-text-muted dark:text-dark-text-muted leading-relaxed">
      Utilizamos cookies técnicas necesarias para el funcionamiento del sitio y analíticas para entender cómo navegas.
      Puedes aceptar todas o rechazar las analíticas opcionales. Consulta nuestra
      <a href="/cookies/"
        class="text-primary hover:text-primary-hover dark:text-dark-primary dark:hover:text-dark-primary-hover underline decoration-1 underline-offset-2 transition-colors">Política de Cookies</a>.
    </p>

    <div class="flex items-center justify-end gap-3 pt-2">
      <button @click="reject()"
        class="px-4 py-2 border border-border dark:border-dark-border hover:bg-gray-100 dark:hover:bg-dark-border text-text dark:text-dark-text rounded-md text-sm font-medium transition-colors duration-200">
        Rechazar
      </button>
      <button @click="accept()"
        class="px-5 py-2 bg-primary hover:bg-primary-hover text-white dark:bg-dark-primary dark:hover:bg-dark-primary-hover rounded-md text-sm font-medium transition-colors duration-200 shadow-sm">
        Aceptar
      </button>
    </div>
  </div>
</div>
