enfoque:
  title: "Mi enfoque en trauma y apego"
  content: |
    El trabajo con trauma requiere un abordaje especializado, respetuoso con tus tiempos y que priorice tu seguridad emocional.

    ### Metodologías que utilizo

    - **[Terapia EMDR](/terapia-emdr/) (Desensibilización y Reprocesamiento por Movimientos Oculares)**: Técnica con amplia evidencia para procesar recuerdos traumáticos de forma segura y efectiva.
    - **Terapia sensoriomotriz**: Trabajo con el cuerpo y las sensaciones para liberar el trauma almacenado.
    - **Modelo de apego**: Entenderemos juntas tu estilo de apego y trabajaremos para desarrollar patrones más seguros, incluyendo su impacto en la maternidad y la [psicología perinatal](/psicologia-perinatal/).
    - **Regulación del sistema nervioso**: Técnicas para gestionar las respuestas de hiperactivación o bloqueo.

    ### El proceso terapéutico

    1. **Seguridad y estabilización**: Antes de procesar trauma, necesitas recursos para regularte.
    2. **Comprensión**: Entender cómo tu historia moldea tu presente.
    3. **Procesamiento**: Trabajar con los recuerdos y experiencias de forma segura.
    4. **Integración**: Incorporar los cambios en tu vida y relaciones actuales.

