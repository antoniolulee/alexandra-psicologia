faq:
  title: "Preguntas Frecuentes sobre Trauma y Apego"
  subtitle: "Dudas habituales sobre cómo sanar heridas vinculares en adultos"
  items:
    - question: "¿Se puede cambiar un estilo de apego inseguro en la edad adulta?"
      answer: "Sí. En psicología clínica se denomina 'apego ganado'. Aunque el patrón ansioso, evitativo o desorganizado se haya formado en la infancia, la psicoterapia especializada permite identificar los disparadores vinculares, regular la respuesta de alarma del sistema nervioso y construir relaciones más seguras."
    - question: "¿Qué diferencia hay entre trauma de choque y trauma relacional?"
      answer: "El trauma de choque proviene de un evento puntual abrumador (un accidente, una agresión o un parto traumático). El trauma relacional o complejo surge de experiencias repetidas en los vínculos tempranos (invalidación emocional, negligencia afectiva o imprevisibilidad en el cuidado) que afectan a la autoestima y a la forma de relacionarse."
    - question: "¿Por qué se combina el trabajo de apego con la terapia EMDR?"
      answer: "Porque comprender racionalmente por qué tienes miedo al abandono o te bloqueas en pareja no siempre basta para dejar de sentirlo. El EMDR actúa sobre la memoria emocional y somática donde quedaron grabadas esas experiencias vinculares."

