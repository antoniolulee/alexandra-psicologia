  content: |
    La infertilidad afecta aproximadamente a 1 de cada 6 parejas en edad reproductiva, pero su impacto psicológico sigue viviendo en silencio. Mes tras mes aparece un duelo invisible por el embarazo que no llega, mientras el entorno repite frases como *"relájate y vendrá"* que aumentan la culpa y el aislamiento.

    ### Fases de la reproducción asistida y qué trabajamos en sesión

    | Etapa del proceso | Desgaste emocional más habitual | Herramientas clínicas en consulta |
    |---|---|---|
    | **Diagnóstico e infertilidad secundaria** | Shock inicial, sensación de injusticia y comparación constante con otras familias | Validación del duelo reproductivo y manejo de eventos sociales o embarazos cercanos |
    | **Estimulación FIV e inseminación** | Labilidad emocional por medicación hormonal y agotamiento de agendas clínicas | Regulación somática y comunicación de límites en el trabajo y entorno |
    | **La betaespera** | Hipervigilancia de síntomas físicos, insomnio y anticipación catastrófica | Técnicas cognitivo-conductuales y de anclaje al presente para reducir la rumiación |
    | **Beta negativa o cancelación de ciclo** | Derrumbe emocional, rabia, tristeza y desgaste en la relación de pareja | Elaboración del duelo tras cada intento y prevención de la autoexigencia de positividad |
    | **Ovodonación y duelo genético** | Dudas sobre el vínculo futuro con el bebé y miedo al secreto o al estigma | Acompañamiento en el duelo genético y toma de decisiones serena y alineada contigo |

    ### ¿Por qué contar con una psicóloga especializada en fertilidad?

    Necesitas un espacio donde no te pidan "pensar en positivo" a la fuerza. Trabajamos estrategias concretas para proteger tu salud mental, tu autoestima y tu relación de pareja mientras atraviesas la incertidumbre médica.

