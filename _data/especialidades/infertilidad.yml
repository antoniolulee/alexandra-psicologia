enfoque:
  title: "Mi enfoque clínico en infertilidad"
  content: |
    Como **Psicóloga Clínica (vía PIR)** acompaño a mujeres y parejas durante todo el recorrido reproductivo: desde los primeros estudios médicos hasta un embarazo logrado o la decisión de cerrar los tratamientos.

    ### Cómo te acompaño

    - **Validación sin positivismo tóxico**: Puedes expresar rabia, envidia hacia embarazos cercanos o cansancio extremo sin sentirte juzgada.
    - **Regulación de la ansiedad médica**: Protocolos prácticos para el día de la punción, la transferencia embrionaria y la espera de resultados.
    - **Claridad en decisiones complejas**: Espacio neutral para decidir sobre número de ciclos, donación de gametos, adopción de embriones o descanso terapéutico.
    - **Integración de pérdidas y trauma médico**: Si has vivido además un aborto tras lograr el positivo, integramos el abordaje específico de [duelo gestacional y perinatal](/duelo-gestacional/) y el área troncal de [psicología perinatal online](/psicologia-perinatal/). Si un diagnóstico o pérdida dejó huella traumática, podemos trabajarlo con [terapia EMDR online](/terapia-emdr/).

    ### Ventajas de la terapia online en reproducción asistida

    - Flexibilidad para reorganizar horarios si la clínica cambia la fecha de una punción o transferencia.
    - Conectar desde la intimidad de tu casa el día de la beta, sin tener que desplazarte ni contener el llanto en público.

