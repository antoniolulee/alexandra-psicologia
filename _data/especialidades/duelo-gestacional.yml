que_es:
  title: "¿Qué es el duelo gestacional y perinatal?"
  bluf: "El duelo gestacional y perinatal es la respuesta emocional y psicológica natural tras la pérdida de un bebé en cualquier semana del embarazo o durante los primeros días de vida. Aunque el entorno suele minimizarlo como un duelo desautorizado, la terapia clínica especializada permite validar el vínculo, procesar el trauma hospitalario y reconstruir tu equilibrio emocional."
  content: |
    El **duelo gestacional** o **duelo perinatal** no depende de las semanas de gestación ni de si pudiste tener a tu bebé en brazos. Desde el momento en que supiste que estabas embarazada, proyectaste un futuro, un vínculo y un lugar afectivo para tu hijo.

    ### Un duelo desautorizado e invisible

    La sociedad tiende a minimizar estas pérdidas con frases bienintencionadas que causan un profundo aislamiento:
    - "Era muy pronto, no te había dado tiempo a encariñarte"
    - "Eres joven, puedes volver a intentarlo"
    - "Es muy común, le pasa a mucha gente"
    - "Al menos no llegaste a conocerlo"

    En psicología clínica reconocemos esta experiencia como un **duelo desautorizado**: un dolor legítimo al que el entorno no da permiso para existir. Aquí tienes un espacio para nombrarlo sin tener que justificarte.

    ### Tipos de pérdida perinatal y abordaje clínico en consulta

    | Situación de pérdida | Impacto emocional frecuente | Cómo lo trabajamos en consulta |
    |---|---|---|
    | **Aborto espontáneo temprano o tardío** | Culpa, shock, sensación de fallo corporal e incomprensión social | Validación del vínculo, desculpabilización y manejo de comentarios del entorno |
    | **Interrupción por motivos médicos (IVET)** | Ambivalencia, peso de la decisión clínica y miedo al juicio | Elaboración compasiva de la decisión tomada desde el amor y cierre simbólico |
    | **Muerte fetal intrauterina o neonatal** | Impacto traumático hospitalario, flashbacks del parto y vacío físico | Reprocesamiento del trauma obstétrico con [terapia EMDR online](/terapia-emdr/) y rituales de despedida |
    | **Embarazo arcoíris posterior** | Hipervigilancia ecográfica, miedo a vincular y culpa hacia el bebé anterior | Regulación del sistema nervioso y diferenciación segura entre la pérdida previa y la nueva gestación |

    ### El duelo en la pareja

    El duelo gestacional afecta a ambos miembros de la pareja, aunque casi nunca se expresa al mismo ritmo ni de la misma forma. A menudo una persona asume el rol de "sostén" y relega su propio dolor, generando distancia o incomprensión mutua que también podemos abordar en sesión.

