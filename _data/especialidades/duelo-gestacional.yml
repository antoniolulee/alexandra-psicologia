enfoque:
  title: "Mi enfoque clínico en duelo gestacional y perinatal"
  content: |
    Trabajo el duelo gestacional desde la **Psicología Clínica (vía PIR)**, con profundo respeto por tu historia, tus creencias y tu ritmo. No existen tiempos estándar ni maneras correctas de hacer un duelo, solo la tuya.

    ### Cómo te acompaño en sesión

    - **Nombrar y legitimar a tu bebé**: Tu hijo existió en tu historia familiar. Podemos hablar de él o ella, con su nombre si lo tiene, sin tabúes.
    - **Validar todas tus emociones**: Damos espacio sin juicio a la tristeza, la rabia, la culpa o la envidia hacia otros embarazos.
    - **Rituales de despedida y vínculo**: Cuando la despedida hospitalaria fue fría o incompleta, construimos rituales simbólicos respetuosos para integrar su recuerdo.
    - **Reprocesamiento del trauma con [terapia EMDR online](/terapia-emdr/)**: Para desensibilizar escenas médicas traumáticas (la noticia ecográfica, el legrado, el parto sin vida o el trato hospitalario).
    - **Puente hacia la [psicología perinatal online](/psicologia-perinatal/)**: Acompañamiento continuo si decides iniciar un nuevo tratamiento o transitas un embarazo posterior.

    ### Lo que nunca haré en consulta

    - No minimizaré tu pérdida por temprana que fuera la semana de gestación.
    - No te diré frases hechas como "la naturaleza es sabia" o "ya tendrás otro".
    - No te presionaré para acelerar tu recuperación ni compararé tu proceso con el de otras mujeres.

    ### Ventajas de la terapia de duelo perinatal online

    Realizar la **terapia de duelo perinatal online** te protege de desplazamientos cuando no tienes fuerzas físicas o emocionales, te evita salas de espera y te permite llorar con total intimidad desde casa, incluso en días de posparto sin bebé en brazos.

