faq:
  title: "Preguntas Frecuentes sobre Duelo Gestacional y Perinatal"
  subtitle: "Respuestas claras y respetuosas sobre el acompañamiento psicológico tras una pérdida"
  items:
    - question: "¿Qué diferencia hay entre duelo gestacional y duelo perinatal?"
      answer: "El duelo gestacional hace referencia al proceso emocional tras una pérdida durante el embarazo (aborto espontáneo, diferido, embarazo ectópico o interrupción médica). El duelo perinatal abarca de forma más amplia las pérdidas ocurridas desde la concepción hasta los primeros días o semanas tras el nacimiento (muerte fetal tardía, intraparto o neonatal)."
    - question: "¿Por qué duele tanto una pérdida en las primeras semanas de embarazo?"
      answer: "Porque el vínculo materno y paterno no se mide en semanas de gestación: desde el test positivo ya existían un proyecto de vida, ilusiones y un lugar afectivo para ese hijo. En psicología clínica se reconoce como un duelo desautorizado cuando el entorno minimiza ese dolor con frases como 'ya vendrán otros'."
    - question: "¿Cómo ayuda la terapia de duelo perinatal tras una pérdida o IVET?"
      answer: "Ofrece un espacio clínico sin juicios para validar la tristeza, la rabia o la culpa, crear rituales simbólicos de despedida, trabajar las diferencias de ritmo en la pareja y, si hubo impacto traumático en el hospital, reprocesar esos recuerdos mediante EMDR."
    - question: "¿Cuándo es recomendable pedir apoyo psicológico si busco un embarazo arcoíris?"
      answer: "Tanto antes de iniciar una nueva búsqueda como al confirmarse el nuevo embarazo. Trabajar el miedo a que vuelva a ocurrir y diferenciar la nueva gestación de la pérdida anterior te ayuda a transitar el embarazo arcoíris con mayor regulación y seguridad."
    - question: "¿Cómo funciona el primer contacto por WhatsApp si ahora mismo me cuesta hablar?"
      answer: "Al pulsar el botón de WhatsApp se abre un mensaje breve ya preparado para que no tengas que pensar qué escribir. Acordamos una llamada gratuita de 15 minutos cuando te sientas cómoda, o resolvemos tus dudas iniciales por texto antes de agendar tu primera sesión online de 50 minutos."

