faq:
  title: "Preguntas Frecuentes sobre Terapia EMDR Online"
  subtitle: "Todo lo que necesitas saber antes de iniciar un proceso de reprocesamiento EMDR"
  items:
    - question: "¿Cómo funciona la terapia EMDR online para adultos?"
      answer: "La terapia EMDR online sigue exactamente las mismas 8 fases clínicas que la consulta presencial. A través de videollamada segura utilizamos estimulación bilateral visual (mediante un punto que se mueve en pantalla), auditiva o táctil (tapping) para ayudar al cerebro a reprocesar recuerdos traumáticos que quedaron bloqueados."
    - question: "¿Qué trata una psicóloga especialista en trauma con EMDR?"
      answer: "Trata desde eventos traumáticos puntuales (partos traumáticos, violencia obstétrica, accidentes, duelos complicados y pérdidas gestacionales) hasta trauma complejo o relacional acumulado en la infancia, ansiedad crónica, fobias específicas, ataques de pánico y bloqueos en las relaciones de apego."
    - question: "¿Es seguro hacer reprocesamiento EMDR por videollamada?"
      answer: "Sí. Antes de iniciar cualquier fase de reprocesamiento, realizamos una evaluación clínica completa (historia clínica y fase de preparación) en la que entrenamos recursos de regulación y anclaje emocional. Solo avanzamos al reprocesamiento cuando cuentas con estabilidad y seguridad."
    - question: "¿Cuántas sesiones de terapia EMDR online son necesarias?"
      answer: "Depende de la historia de cada persona. Un evento traumático único y reciente en un adulto con buenos recursos previos puede reprocesarse en pocas semanas tras la fase de preparación; el trauma relacional complejo o las heridas de apego requieren un proceso más gradual y profundo."

