# QUÉ ES
# ============================================
que_es:
  title: "¿Qué es la Terapia EMDR Online y cómo funciona?"
  bluf: "La terapia EMDR online para adultos es un tratamiento psicoterapéutico de primera línea, avalado por la OMS y la APA, que reprocesa recuerdos traumáticos, ansiedad crónica y heridas de apego mediante estimulación bilateral guiada por videollamada. Permite desensibilizar el malestar emocional almacenado para que el pasado deje de activarse en tu presente."
  content: |
    La **terapia EMDR online para adultos** (*Eye Movement Desensitization and Reprocessing*) es un abordaje psicoterapéutico de primera línea, avalado por la **OMS** y la **APA**, para reprocesar recuerdos traumáticos, ansiedad crónica y heridas de apego mediante estimulación bilateral guiada por videollamada. Permite desensibilizar el malestar emocional para que el pasado deje de activarse en tu presente.

    Desarrollada por la psicóloga Francine Shapiro en 1987, la terapia EMDR se basa en el **modelo de Procesamiento Adaptativo de la Información (PAI)**. Cuando vivimos experiencias traumáticas o desbordantes, el sistema nervioso no logra archivarlas correctamente y quedan "bloqueadas" con las mismas emociones, sensaciones físicas y creencias negativas del momento original.

    ### ¿Cómo se aplica la estimulación bilateral en EMDR online?

    En sesión por videollamada aplicamos las mismas **8 fases clínicas** que en consulta presencial, adaptando la estimulación bilateral a tu comodidad y tolerancia sensorial:

    | Modalidad Online | Cómo se realiza en sesión | Ventaja clínica principal |
    |---|---|---|
    | **Visual** | Seguimiento ocular de un punto de luz o barra móvil en tu pantalla | Alta focalización atencional y control preciso de la velocidad |
    | **Táctil (*Tapping*)** | Autotoques alternos en hombros ("abrazo de la mariposa") o rodillas | Regulación somática inmediata y sensación de contención |
    | **Auditiva** | Tonos bilaterales alternos con auriculares estándar | Ideal si existe fatiga visual o prefieres cerrar los ojos |

    Esta estimulación activa los mecanismos naturales de procesamiento del cerebro, permitiendo que:

    - Las memorias traumáticas se integren de forma adaptativa sin revivir el sufrimiento
    - Las emociones intensas y respuestas fisiológicas de alarma disminuyan
    - Las creencias limitantes ("no estoy a salvo", "no soy suficiente") se transformen en convicciones realistas

    ### Formación acreditada como Psicóloga Clínica (PIR)

    Como **Psicóloga Especialista en Psicología Clínica (vía PIR)** con formación oficial acreditada en EMDR, aplico el protocolo completo garantizando una fase previa de estabilización y seguridad emocional antes de abordar cualquier recuerdo difícil.

