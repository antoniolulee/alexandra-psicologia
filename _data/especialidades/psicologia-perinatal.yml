enfoque:
  title: "Mi enfoque en Psicología Perinatal"
  content: |
    Trabajo desde la **Psicología Clínica (vía PIR)** con una perspectiva integradora, humana y libre de juicios. En mi consulta no existen las "buenas o malas madres": existe una mujer atravesando un momento vital de máxima exigencia que merece sostén profesional.

    ### Metodologías basadas en evidencia que utilizo

    - **[Terapia EMDR para trauma perinatal](/terapia-emdr/)**: Reprocesamiento seguro de partos traumáticos, violencia obstétrica, pérdidas gestacionales o experiencias médicas en UCI neonatal.
    - **Regulación del sistema nervioso y apego**: Estrategias prácticas para reducir la hipervigilancia posparto, calmar los pensamientos intrusivos y fortalecer el vínculo seguro.
    - **Terapia narrativa y matrescencia**: Reescribir expectativas irreales sobre la maternidad para aliviar la culpa y recuperar tu espacio personal.
    - **Acompañamiento flexible adaptado al bebé**: En las sesiones de **salud perinatal online** de 50 minutos, tu bebé siempre es bienvenido; puedes amamantar, dar el biberón o portear durante la consulta.

    ### Continuidad con el resto de tu proceso

    Si además atraviesas una pérdida o estás en tratamiento médico de fertilidad, coordinamos el trabajo clínico con nuestras áreas específicas de [duelo gestacional y perinatal](/duelo-gestacional/) e [infertilidad y reproducción asistida](/infertilidad/).

