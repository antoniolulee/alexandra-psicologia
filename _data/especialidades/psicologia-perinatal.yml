que_es:
  title: "¿Qué es la Psicología Perinatal Online?"
  bluf: "La psicología perinatal online es la especialidad sanitaria que atiende la salud mental de la mujer y su pareja desde la búsqueda del embarazo hasta el posparto y la crianza temprana. Permite prevenir y tratar la ansiedad gestacional, el miedo al parto, la depresión posparto y el parto traumático mediante psicoterapia basada en evidencia desde casa."
  content: |
    La maternidad implica una transformación biológica, hormonal y de identidad conocida en psicología como **matrescencia**. Cuando los cambios físicos y la presión por "estar siempre feliz" chocan con la realidad emocional del embarazo o el puerperio, contar con atención clínica especializada marca la diferencia.

    ### Diferencias clínicas frecuentes en el posparto

    | Cuadro clínico | Duración y aparición | Señales principales | Intervención recomendada |
    |---|---|---|---|
    | **Baby Blues (tristeza posparto)** | Días 2–5 tras el parto; remite antes de los 15 días | Llanto fácil, hipersensibilidad y cansancio por reajuste hormonal | Psicoeducación, descanso protegido y sostén familiar |
    | **Depresión Posparto** | Persiste más de 2 semanas o aparece meses después | Tristeza profunda, anhedonia, culpa intensa y desconexión del bebé | Psicoterapia perinatal clínica estructurada y evaluación médica coordinada |
    | **Ansiedad y TOC Perinatal** | Embarazo o posparto temprano | Hipervigilancia constante o pensamientos intrusivos no deseados (egodistónicos) | Regulación del sistema nervioso, terapia cognitiva y desestigmatización |
    | **TEPT tras Parto Traumático** | Tras cesárea de urgencia o violencia obstétrica | Flashbacks, pesadillas, rechazo a revisiones médicas o bloqueo vinculante | Reprocesamiento seguro con [terapia EMDR online](/terapia-emdr/) |

    ### ¿Por qué es clave cuidar tu salud perinatal online?

    - **Previene la cronificación del malestar** en embarazo y puerperio al intervenir de forma temprana.
    - **Integra experiencias difíciles** como el [duelo gestacional y perinatal](/duelo-gestacional/), procesos de [infertilidad](/infertilidad/) o secuelas de un parto traumático.
    - **Protege el vínculo con tu bebé** desde la regulación emocional real, sin exigencias ni culpa materna.

