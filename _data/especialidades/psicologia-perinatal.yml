# ============================================
# ENFOQUE
# ============================================
enfoque:
  title: "Mi enfoque en Psicología Perinatal"
  content: |
    Trabajo desde una perspectiva **integradora y respetuosa**, entendiendo que cada mujer vive la maternidad de forma única. No existe una manera "correcta" de sentirse, y todas tus emociones son válidas.

    Mi objetivo no es decirte cómo debes sentirte o qué decisiones tomar, sino acompañarte en el proceso de conectar con tus propias necesidades y recursos.

    ### Metodologías que utilizo

    - **Enfoque narrativo**: Te ayudo a reescribir las historias que te cuentas sobre la maternidad, liberándote de expectativas imposibles y culpas innecesarias.
    - **[Terapia EMDR para trauma perinatal](/terapia-emdr/)**: Especialmente útil para procesar partos traumáticos, violencia obstétrica, pérdidas gestacionales o experiencias médicas difíciles.
    - **Regulación emocional**: Técnicas para gestionar la intensidad emocional del postparto sin desbordarte.
    - **Trabajo con el vínculo**: Herramientas para facilitar la conexión con tu bebé desde la seguridad.

    ### Especialista en Salud Perinatal Online y Terapia Postparto

    **La terapia de salud perinatal online** permite que puedas acceder a este acompañamiento clínico especializado (PIR) sin salir de casa, algo especialmente valioso durante:
    - El embarazo de riesgo o reposo
    - El postparto inmediato, cuando salir con un bebé es un reto
    - Las tomas del bebé (puedes conectarte con bebé en brazos, ¡lo hemos hecho muchas veces!)
    - Procesos de [reproducción asistida e infertilidad](/infertilidad/) o tras una [pérdida gestacional](/duelo-gestacional/)

    También trabajo incluir a la pareja en sesiones puntuales cuando es relevante para el proceso.

# ============================================
# PREGUNTAS FRECUENTES (FAQPage Schema)
# ============================================
faq:
  title: "Preguntas Frecuentes sobre Psicología Perinatal Online"
  subtitle: "Resolvemos tus dudas sobre el acompañamiento psicológico en embarazo, parto y posparto"
  items:
    - question: "¿Cuándo acudir a una psicóloga perinatal online?"
      answer: "Es recomendable solicitar apoyo cuando experimentas ansiedad persistente en el embarazo, miedo intenso al parto (tocofobia), tristeza profunda tras el nacimiento que supera las dos semanas, pensamientos intrusivos que te asustan, dificultades para vincular con tu bebé o tras atravesar un parto traumático o una pérdida gestacional."
    - question: "¿Qué diferencia hay entre el baby blues y la depresión posparto?"
      answer: "El baby blues es una labilidad emocional transitoria provocada por el reajuste hormonal tras el parto; aparece en los primeros días y remite de forma espontánea antes de las dos semanas. La depresión posparto, en cambio, persiste más allá de ese plazo, interfiere con tu descanso y cuidado diario, y requiere evaluación y psicoterapia especializada."
    - question: "¿Cómo funciona la terapia de salud perinatal online con un bebé recién nacido?"
      answer: "Las sesiones de 50 minutos se realizan por videollamada cifrada desde tu hogar, evitando desplazamientos con el recién nacido. Tu bebé es bienvenido en la sesión: puedes amamantar, portear o atender sus necesidades mientras trabajamos juntas a tu ritmo."
    - question: "¿Cómo ayuda la terapia EMDR en un parto traumático o pérdida gestacional?"
      answer: "La terapia EMDR permite reprocesar de forma segura los recuerdos médicos o emocionales que quedaron bloqueados tras una cesárea de urgencia, violencia obstétrica o una muerte perinatal, reduciendo los flashbacks, la hipervigilancia y el miedo ante futuros embarazos."

