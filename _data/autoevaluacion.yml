# ============================================
# AUTOEVALUACIÓN CLÍNICA ORIENTATIVA (NO DIAGNÓSTICA)
# ============================================
badge: "Orientación clínica autoguiada · 1 minuto"
title: "¿Dudas sobre si lo que sientes requiere apoyo psicológico?"
subtitle: "Responde a estas 3 preguntas breves para situar tu momento actual y orientarte hacia el enfoque clínico más adecuado. Tus respuestas son 100% privadas y no se guardan."
privacy_note: "Confidencialidad local: tus respuestas se procesan únicamente en tu navegador y no se envían a ningún servidor."
disclaimer_title: "Orientación informativa, no diagnóstica"
disclaimer_text: "Esta guía tiene carácter exclusivamente orientativo y no sustituye una evaluación clínica profesional. Si atraviesas una crisis aguda o riesgo inmediato, llama gratis 24h al 024 (Atención a la conducta suicida), al 717 003 717 (Teléfono de la Esperanza) o al 112 (Emergencias)."
crisis_title: "Prioridad de cuidado y contención inmediata"
crisis_text: "Si sientes que estás al límite de tus fuerzas o necesitas contención urgente, contacta de forma inmediata y gratuita las 24h con los recursos de emergencia o escríbeme indicando que necesitas valoración prioritaria."

steps:
  - key: "etapa"
    number: 1
    label: "Momento vital"
    question: "¿Con qué situación o etapa tiene más que ver lo que vives hoy?"
    hint: "Selecciona el ámbito que mejor describa tu situación actual."
    options:
      - value: "perinatal"
        icon: "baby"
        title: "Embarazo, posparto o maternidad reciente"
        desc: "Ansiedad gestacional, tristeza o culpa en el puerperio, pensamientos intrusivos, parto difícil o sobrecarga materna."
      - value: "infertilidad"
        icon: "refresh"
        title: "Búsqueda de embarazo o reproducción asistida"
        desc: "Desgaste emocional por esperas médicas, betaespera, ciclos de IA o FIV, resultados negativos o duelo genético."
      - value: "duelo_perinatal"
        icon: "cloud"
        title: "Pérdida gestacional o duelo perinatal"
        desc: "Aborto espontáneo o recurrente, interrupción del embarazo, pérdida tras reproducción asistida o duelo perinatal."
      - value: "trauma_apego"
        icon: "heart"
        title: "Ansiedad persistente, trauma, apego o duelo vital"
        desc: "Bloqueo emocional, experiencias difíciles pasadas, patrones que se repiten en tus relaciones o pérdida de un ser querido."
  - key: "sintoma"
    number: 2
    label: "Vivencia"
    question: "¿Qué se acerca más a lo que estás notando últimamente?"
    hint: "No hay respuestas correctas ni incorrectas; sirve para afinar la orientación."
    options:
      - value: "hipervigilancia"
        title: "Alerta constante, insomnio o pensamientos intrusivos"
        desc: "Anticipo que algo malo va a ocurrir, me cuesta descansar o aparecen miedos e imágenes involuntarias que me angustian."
      - value: "tristeza_culpa"
        title: "Tristeza, culpa o sensación de desconexión"
        desc: "Siento que debería poder con todo, pero noto apatía, llanto silencioso, irritabilidad o distancia respecto a lo que vivo."
      - value: "impacto_medico"
        title: "Recuerdos difíciles de un parto o proceso médico"
        desc: "Una intervención obstétrica, una urgencia, una consulta médica o una noticia difícil reactivan tensión física y temor."
      - value: "desgaste_relacional"
        title: "Sobrecarga silenciosa y dificultad en los vínculos"
        desc: "Hacia fuera mantengo la rutina, pero por dentro me siento sola, sobreexigida o con miedo constante a fallar."
  - key: "interferencia"
    number: 3
    label: "Día a día"
    question: "¿Cómo está influyendo este malestar en tu descanso y tu rutina?"
    hint: "Nos ayuda a adecuar el ritmo de la recomendación."
    options:
      - value: "intenso"
        title: "Está presente casi a diario"
        desc: "Llevo semanas notando que condiciona mi sueño, mi estado de ánimo, mi calma o mis relaciones cercanas."
      - value: "olas"
        title: "Va por olas según el momento"
        desc: "Hay días en que sostengo la rutina y momentos (de noche, en fechas señaladas o ante citas médicas) en que me desborda."
      - value: "preventivo"
        title: "Es reciente, pero prefiero cuidarme a tiempo"
        desc: "Empiezo a notar el desgaste y busco orientación clínica antes de que el malestar vaya a más."
      - value: "alerta_aguda"
        title: "Siento que ahora mismo me supera"
        desc: "Se me hace muy cuesta arriba sostenerlo sola y necesito orientación prioritaria."
