about:
  title: "Hola, soy Alexandra"
  image: "/assets/images/alexandra-about.webp"
  bio_intro: "Algunos dicen que la psicología te elige. A mí me eligió."
  bio_main: |
    La curiosidad por comprender **por qué sufrimos** y cómo podemos dejar de hacerlo me ha llevado a dedicar más de 15 años al estudio y trabajo en el ámbito de la Psicología Clínica.
    
    Trabajo desde una orientación **integradora** con un enfoque **humanista, personal y cercano**. Mi terapia se adapta a ti, no al revés: selecciono las técnicas más efectivas de cada enfoque para crear un tratamiento a tu medida.
  bio_boutique: "Sin intermediarios. Sin algoritmos. Solo tú y yo, trabajando en equipo para reescribir las narrativas que te causan sufrimiento."
  cta_more: "Conoce mi historia completa"
  cta_more_url: "/sobre-mi/"
  signature: "Alexandra"

