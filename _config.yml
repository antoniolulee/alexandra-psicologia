# Jekyll configuration
title: "Alexandra Barroso | Psicóloga Clínica Online"
description: "Psicóloga Especialista en Psicología Clínica (vía PIR · Colegiada CV-13539). Psicoterapia 100% online especializada en Salud Perinatal, Duelo Gestacional, Reproducción Asistida, Trauma, Apego y Terapia EMDR."
url: "https://alexandrabarroso.com"
baseurl: ""
lang: "es"

# Build settings
markdown: kramdown
permalink: pretty
future: true

# Plugins (GitHub Pages whitelist)
plugins:
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - 01-TOOLS
  - 02-DOCS
  - .rsc
  - .gemini
  - .antigravity
  - .codex
  - AGENTS.md
  - GEMINI.md
  - REVIEW.md
  - auditoria.md
  - package.json
  - package-lock.json
  - tailwind.config.js
  - vendor
  - assets/images/Alejandra_LQ/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "especialidades"
    values:
      layout: "especialidad"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Alexandra Barroso"
      permalink: /blog/:title/
      image: /assets/images/alexandra-about.webp
